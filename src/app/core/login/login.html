<div class="login-container">
  <div class="login-card">
    <div class="login-header">
      <h2>Iniciar Sesión</h2>
      <p>Ingresa tus credenciales para acceder</p>
    </div>

    <form class="login-form" (ngSubmit)="onSubmit($event)">
      <div class="form-group">
        <label for="nombreUsuario">Nombre de Usuario</label>
        <input 
          type="text" 
          id="nombreUsuario" 
          name="nombreUsuario" 
          [(ngModel)]="credentials.nombreUsuario"
          required 
          placeholder="Ingresa tu nombre de usuario"
          [disabled]="isLoading">
      </div>

      <div class="form-group">
        <label for="contrasena">Contraseña</label>
        <input 
          type="password" 
          id="contrasena" 
          name="contrasena" 
          [(ngModel)]="credentials.contrasena"
          required 
          placeholder="••••••••"
          [disabled]="isLoading">
      </div>

      <div class="error-message" *ngIf="errorMessage">
        {{ errorMessage }}
      </div>

      <div class="form-options">
        <label class="checkbox-container">
          <input type="checkbox" name="remember">
          <span class="checkmark"></span>
          Recordarme
        </label>
        <a href="#" class="forgot-password">¿Olvidaste tu contraseña?</a>
      </div>

      <button type="submit" class="login-btn" [disabled]="isLoading">
        <span *ngIf="isLoading">Iniciando sesión...</span>
        <span *ngIf="!isLoading">Iniciar Sesión</span>
      </button>

      <div class="signup-link">
        <p>¿No tienes una cuenta? <a (click)="goToRegister()" class="signup-btn">Regístrate aquí</a></p>
      </div>
    </form>
  </div>
</div>
